[package]
name = "git-bigstore-rs"
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
description = "Large files in git, your bucket, one binary."
license = "Apache-2.0"
repository = "https://github.com/rmorgans/git-bigstore-rs"

[lib]
name = "bigstore"
path = "src/lib.rs"

[[bin]]
name = "git-bigstore"
path = "src/main.rs"
required-features = ["cli"]

# Its own harness: a subprocess of the test binary serves the exchange
# protocol on stdout, where libtest would write.
[[test]]
name = "exchange"
harness = false

[features]
default = ["cli"]
# The git-bigstore binary, with every backend and progress bars. Library users
# (`bigstore::folder`, …) can turn it off with `default-features = false` and
# pick features from below.
cli = ["dep:clap", "dep:tracing-subscriber", "progress", "gcp", "azure", "aws-lc-rs"]
# Progress bars on stderr while `bigstore::transfer` pushes or pulls.
progress = ["dep:indicatif"]
# gs:// (Google Cloud Storage) and az:// (Azure Blob Storage) remotes. Without
# them those URLs fail with an error naming the feature; s3://, local:// and
# rclone:// are always available.
gcp = ["object_store/gcp-base"]
azure = ["object_store/azure-base"]
# The crypto behind TLS and request signing for s3://, gs:// and az://. Enable
# one; with both, aws-lc-rs is used (as object_store does). With neither, only
# local:// and rclone:// work and a cloud URL fails with an error.
aws-lc-rs = ["object_store/aws-lc-rs", "reqwest/rustls"]
ring = ["object_store/ring", "dep:rustls"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
futures = "0.3.32"
gethostname = "1.1.0"
globset = "0.4.18"
hex = "0.4"
indicatif = { version = "0.18.4", optional = true }
md-5 = "0.10.6"
object_store = { version = "0.14", features = ["aws-base", "reqwest"] }
# Folder push and pull with `Link::Place`: clonefile (macOS), FICLONE (Linux),
# block cloning (Windows ReFS).
reflink-copy = "0.1.30"
# Direct only to choose reqwest's TLS crypto: object_store needs rustls, and
# `rustls-no-provider` leaves the provider to the aws-lc-rs / ring features.
# object_store already depends on it.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Direct only to install ring as the process's rustls provider (ring feature);
# reqwest already depends on it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# NFC normalization, which std lacks: folder pull refuses manifest names that
# macOS (APFS/HFS+) would store as one file because they differ only by
# Unicode normalization.
unicode-normalization = "0.1.25"
url = "2"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
