[package]
name = "git-bigstore-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Large files in git, your bucket, one binary."
license = "Apache-2.0"
repository = "https://github.com/rmorgans/git-bigstore-rs"

[lib]
name = "bigstore"
path = "src/lib.rs"

[[bin]]
name = "git-bigstore"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The git-bigstore binary. Library users (`bigstore::folder`, …) can turn it
# off with `default-features = false` and drop clap and tracing-subscriber.
cli = ["dep:clap", "dep:tracing-subscriber", "progress"]
# Progress bars on stderr while `bigstore::transfer` pushes or pulls.
progress = ["dep:indicatif"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
futures = "0.3.32"
globset = "0.4.18"
hex = "0.4"
indicatif = { version = "0.18.4", optional = true }
md-5 = "0.10.6"
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
url = "2"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
