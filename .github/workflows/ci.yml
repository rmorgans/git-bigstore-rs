name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install pinned DVC
        run: |
          uv tool install dvc==3.67.1
          echo "BIGSTORE_TEST_DVC=$(command -v dvc)" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Library builds without the CLI
        run: cargo build --lib --no-default-features

      - name: Library feature combinations
        run: |
          for features in ring aws-lc-rs ring,aws-lc-rs ring,gcp,azure,progress; do
            cargo clippy --lib --tests --no-default-features --features "$features" -- -D warnings
          done

      - name: Library tests without the CLI
        run: |
          cargo test --lib --no-default-features
          cargo test --lib --no-default-features --features ring

      - name: Test
        run: cargo test --all-targets -- --include-ignored

      - name: Supply-chain checks
        run: cargo deny check

      - name: Coverage
        run: cargo llvm-cov --all-targets --fail-under-lines 80 --summary-only

  windows:
    name: Windows (folder mode)
    runs-on: windows-latest
    # bash runs with -e, so every command in a step counts. The pwsh
    # default only fails a step on its last command's exit code, which hid
    # failing test runs earlier in a multi-line step.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install pinned DVC
        shell: bash
        run: |
          uv tool install dvc==3.67.1
          # A native path: the tests spawn it without a POSIX shell.
          echo "BIGSTORE_TEST_DVC=$(cygpath -w "$(command -v dvc.exe || command -v dvc)")" >> "$GITHUB_ENV"

      - name: Install rclone
        # The official zip: one download, no package manager.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath "$env:RUNNER_TEMP\rclone"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\rclone" -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_PATH $dir
          & "$dir\rclone.exe" version

      - name: Build release
        run: cargo build --release --locked

      - name: Library builds with ring
        run: cargo build --lib --locked --no-default-features --features ring

      - name: Folder-mode tests
        run: |
          cargo test --lib -- folder dvc types
          cargo test --test folder
          cargo test --test dvc_compat -- --ignored

      - name: rclone round trip
        # rclone gets a verbatim (\\?\) temp directory for each download.
        run: cargo test --test folder -- --ignored --exact round_trips_through_an_rclone_remote

      - name: Long paths without the OS opt-in
        # With LongPathsEnabled off, Win32 gives no process paths past
        # MAX_PATH unless they are verbatim (\\?\), so this proves folder
        # mode does not depend on the machine's setting.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          "LongPathsEnabled was $((Get-ItemProperty $key).LongPathsEnabled)"
          Set-ItemProperty $key -Name LongPathsEnabled -Value 0
          cargo test --test folder -- --exact outputs_and_files_beyond_max_path_push_and_pull

      - name: Upload git-bigstore.exe
        uses: actions/upload-artifact@v4
        with:
          name: git-bigstore-windows-x86_64
          path: target/release/git-bigstore.exe
