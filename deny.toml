# cargo-deny configuration — supply-chain gate.
#   cargo install cargo-deny
#   cargo deny check
#
# Run in CI to fail on security advisories, yanked crates, disallowed
# licenses, or dependencies from untrusted sources.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Mozilla CA bundle data (webpki-root-certs, via reqwest's platform verifier).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
